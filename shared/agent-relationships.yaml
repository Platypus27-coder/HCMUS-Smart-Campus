# Source-of-truth relationship graph. Keys are source agent IDs.
# Only context needed by the target task may be included in a handoff.
version: "1.0"
allowed_relationship_types: [requests_validation_from, provides_data_to, collaborates_with, refers_to, supports]
relationships:
  scholarship-matching-agent:
    - target: gpa-academic-standing-agent
      relationship: requests_validation_from
      reason: "Scholarship assessment can require calculation or projection of user-provided GPA data."
      triggers: ["scholarship eligibility depends on GPA", "projected GPA is required", "GPA needs recalculation from user-provided grades"]
      send: [current_gpa, earned_credits, planned_courses, expected_grades]
      do_not_send: [student_id, full_transcript, financial_information, unrelated_personal_data]
      expected_output: [calculated_gpa, projected_gpa, academic_status]
    - target: administrative-procedure-agent
      relationship: refers_to
      reason: "A user who has a verified opportunity may need procedural guidance for preparing an application."
      triggers: ["user asks how to prepare an application", "a verified scholarship requires documents", "user requests submission steps"]
      send: [opportunity_identifier, required_documents, deadline_context]
      do_not_send: [student_id, financial_records, unrelated_academic_history]
      expected_output: [procedure_guidance, document_checklist, next_actions]

  academic-advisor-agent:
    - target: gpa-academic-standing-agent
      relationship: requests_validation_from
      reason: "A proposed study plan may depend on a user-provided current or projected GPA."
      triggers: ["user asks for GPA impact", "plan needs a GPA projection", "academic status needs calculation"]
      send: [current_gpa, earned_credits, planned_courses, expected_grades]
      do_not_send: [student_id, full_transcript, unrelated_personal_data]
      expected_output: [calculated_gpa, projected_gpa, academic_status]
    - target: schedule-deadline-agent
      relationship: collaborates_with
      reason: "A tentative semester plan may need public calendar or deadline guidance."
      triggers: ["user asks about planning dates", "registration timing is relevant", "public academic deadline needs verification"]
      send: [academic_year, campus, date_range, request_topic]
      do_not_send: [course_grades, student_id, unrelated_personal_data]
      expected_output: [schedule_guidance, deadline_checklist, verification_recommendation]
    - target: library-research-agent
      relationship: supports
      reason: "Recommended learning plans can be supported with a search strategy for relevant course resources."
      triggers: ["user requests study resources", "course names are known", "user needs a learning-resource search strategy"]
      send: [major, course_names, learning_goals]
      do_not_send: [student_id, current_gpa, unrelated_personal_data]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]

  library-research-agent:
    - target: specialized-major-tutor-agent
      relationship: collaborates_with
      reason: "Literature search and digital database queries can collaborate with specialized major topics and research domains."
      triggers: ["specialized academic search is needed", "technical domain resources are requested", "user asks for advanced papers"]
      send: [research_topic, keywords, preferred_databases]
      do_not_send: [student_id, unrelated_personal_data, private_library_credentials]
      expected_output: [specialized_guidance, learning_roadmap, user_context_summary]

  clubs-activities-agent:
    - target: regulation-qa-agent
      relationship: requests_validation_from
      reason: "Participation-related questions may need verified clarification of applicable rules."
      triggers: ["user asks about a rule", "participation condition needs clarification", "activity guidance depends on a regulation"]
      send: [question, regulation_topic, situation_summary]
      do_not_send: [student_id, unrelated_personal_data, sensitive_personal_information]
      expected_output: [regulation_guidance, source_requirements, verification_recommendation]

  administrative-procedure-agent:
    - target: department-contact-agent
      relationship: refers_to
      reason: "A procedure may require the user to confirm details with the responsible unit."
      triggers: ["responsible unit is unknown", "user needs a contact channel", "procedure requires official confirmation"]
      send: [procedure_type, request_topic, campus, preferred_contact_channel]
      do_not_send: [student_id, submitted_documents, unrelated_personal_data]
      expected_output: [responsible_unit_guidance, contact_guidance, follow_up_steps]
    - target: regulation-qa-agent
      relationship: requests_validation_from
      reason: "A procedure may depend on an applicable rule that needs verified explanation."
      triggers: ["rule interpretation is needed", "user disputes a procedure condition", "policy source must be clarified"]
      send: [question, regulation_topic, situation_summary]
      do_not_send: [student_id, sensitive_personal_information, unrelated_personal_data]
      expected_output: [regulation_guidance, source_requirements, verification_recommendation]

  regulation-qa-agent:
    - target: administrative-procedure-agent
      relationship: refers_to
      reason: "After a regulation is explained, the user may need practical procedure and document guidance."
      triggers: ["user asks what to do next", "documents are needed", "a submission process is requested"]
      send: [procedure_type, purpose, deadline_context, available_documents]
      do_not_send: [student_id, full_case_history, unrelated_personal_data]
      expected_output: [procedure_guidance, document_checklist, next_actions]
    - target: department-contact-agent
      relationship: refers_to
      reason: "Official resolution or dispute of a regulation requires direct contact with the responsible department."
      triggers: ["user asks where the department is located", "contact details for legal or exam board needed", "official appeal appointment requested"]
      send: [request_topic, campus, preferred_contact_channel]
      do_not_send: [student_id, sensitive_personal_information, unrelated_personal_data]
      expected_output: [responsible_unit_guidance, contact_guidance, follow_up_steps]

  department-contact-agent:
    - target: administrative-procedure-agent
      relationship: refers_to
      reason: "Inquiring about department locations or hours often leads to administrative procedure and form requirements."
      triggers: ["user asks how to submit a form at this office", "document requirements needed", "office visit is for an administrative procedure"]
      send: [request_topic, campus, procedure_type]
      do_not_send: [student_id, unrelated_personal_data]
      expected_output: [procedure_guidance, document_checklist, next_actions]
    - target: regulation-qa-agent
      relationship: refers_to
      reason: "A user contacting the Legal or Inspection department may need verified explanation of school regulations."
      triggers: ["contact inquiry is about a disciplinary dispute", "user needs academic regulation explanation", "rule interpretation requested"]
      send: [question, regulation_topic, situation_summary]
      do_not_send: [student_id, sensitive_personal_information, unrelated_personal_data]
      expected_output: [regulation_guidance, source_requirements, verification_recommendation]


  schedule-deadline-agent:
    - target: department-contact-agent
      relationship: refers_to
      reason: "Public schedule information can require confirmation from the responsible unit."
      triggers: ["information is missing or outdated", "user asks who can confirm", "public deadline needs official verification"]
      send: [request_topic, campus, preferred_contact_channel]
      do_not_send: [student_id, unrelated_personal_data, private_calendar_data]
      expected_output: [responsible_unit_guidance, contact_guidance, follow_up_steps]

  general-education-tutor-agent:
    - target: library-research-agent
      relationship: collaborates_with
      reason: "Finding official textbooks and exercises for general education courses."
      triggers: ["user needs official calculus/physics textbooks", "sample problem books are requested", "course syllabus references needed"]
      send: [course_name, topic_name, learning_goals]
      do_not_send: [student_id, exam_questions, unrelated_personal_data]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]
    - target: academic-advisor-agent
      relationship: refers_to
      reason: "When general education academic failure affects progress or prerequisite chains."
      triggers: ["student fails prerequisite general ed course", "user asks about retaking rules", "course withdrawal advice is needed"]
      send: [course_name, current_gpa, earned_credits]
      do_not_send: [student_id, full_transcript, exam_content]
      expected_output: [progress_summary, tentative_study_plan, risk_notes]

  political-theory-tutor-agent:
    - target: library-research-agent
      relationship: collaborates_with
      reason: "Locating official MoET political theory textbooks and reference materials at HCMUS library."
      triggers: ["user requests official political theory textbook", "study guide materials are needed", "curriculum references requested"]
      send: [course_name, topic_name, exam_review_topic]
      do_not_send: [student_id, exam_papers, unrelated_personal_data]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]
    - target: academic-advisor-agent
      relationship: refers_to
      reason: "Planning the distribution of 5 mandatory political theory courses across semesters."
      triggers: ["user asks when to take political theory courses", "registration planning needed", "course scheduling questions"]
      send: [academic_year, major, learning_goals]
      do_not_send: [student_id, unrelated_personal_data]
      expected_output: [progress_summary, tentative_study_plan, risk_notes]

  core-foundations-tutor-agent:
    - target: general-education-tutor-agent
      relationship: supports
      reason: "Core foundation algorithms and systems require discrete math, calculus, or probability background."
      triggers: ["algorithm analysis requires mathematical foundations", "discrete math concept needed", "probability background required"]
      send: [course_name, algorithm_topic, learning_goals]
      do_not_send: [student_id, graded_code, homework_solutions]
      expected_output: [concept_explanation, solution_guidance, user_context_summary]
    - target: library-research-agent
      relationship: collaborates_with
      reason: "Locating classic CS textbooks and reference guides (CLRS, Silberschatz)."
      triggers: ["user requests classic algorithm/database textbooks", "reference code documentation needed"]
      send: [course_name, algorithm_topic, programming_language]
      do_not_send: [student_id, graded_code, homework_solutions]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]

  specialized-major-tutor-agent:
    - target: core-foundations-tutor-agent
      relationship: supports
      reason: "Advanced specialized topics build upon foundational data structures, algorithms, and system concepts."
      triggers: ["advanced topic requires core DSA review", "database design fundamentals needed", "system programming foundation needed"]
      send: [specialization, course_name, advanced_topic]
      do_not_send: [student_id, capstone_proposals, private_project_code]
      expected_output: [conceptual_guidance, algorithmic_hints, user_context_summary]
    - target: library-research-agent
      relationship: collaborates_with
      reason: "Directing users to IEEE Xplore, ACM Digital Library, and Springer for specialized papers."
      triggers: ["user needs academic papers on AI/Security", "literature review for project", "citation for thesis topic"]
      send: [specialization, advanced_topic, technology_stack]
      do_not_send: [student_id, private_project_code, credentials]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]
    - target: academic-advisor-agent
      relationship: refers_to
      reason: "Checking capstone project (KLTN) eligibility and required prerequisite credits."
      triggers: ["user asks about graduation thesis eligibility", "credit requirements for graduation project", "advising on specialization track"]
      send: [major, current_gpa, earned_credits]
      do_not_send: [student_id, project_drafts, exam_content]
      expected_output: [progress_summary, tentative_study_plan, risk_notes]

  student-wellbeing-agent:
    # These are optional, user-approved sequential referrals, not automatic
    # multi-intent execution. Keep health details out of every free-text field.
    - target: soft-skills-coach-agent
      relationship: refers_to
      reason: "After wellbeing support, the user may choose a separate skill-practice goal."
      triggers: ["user requests time-management practice", "user wants presentation or communication practice", "user chooses skill coaching after overload support"]
      send: [skill_goal, practice_context, career_interests]
      do_not_send: [health_details, student_id, medical_records, sensitive_personal_information, unrelated_personal_data, raw_conversation]
      expected_output: [practice_plan, feedback_framework, next_steps]
    - target: gpa-academic-standing-agent
      relationship: refers_to
      reason: "Grade-related stress may include a separate request to calculate or project user-provided GPA data."
      triggers: ["user requests GPA calculation", "user requests GPA projection while discussing academic stress"]
      send: [current_gpa, earned_credits, course_grades, planned_courses, expected_grades]
      do_not_send: [health_details, student_id, full_transcript, medical_records, sensitive_personal_information, unrelated_personal_data, raw_conversation]
      expected_output: [calculated_gpa, projected_gpa, academic_status]
    - target: academic-advisor-agent
      relationship: refers_to
      reason: "A user seeking reduced academic workload may need a tentative study plan based on verified programme information."
      triggers: ["user wants to review next semester workload", "user requests academic planning after overload support"]
      send: [major, academic_year, completed_courses, planned_courses, learning_goals]
      do_not_send: [health_details, student_id, full_transcript, medical_records, sensitive_personal_information, unrelated_personal_data, raw_conversation]
      expected_output: [progress_summary, tentative_study_plan, risk_notes]
    - target: schedule-deadline-agent
      relationship: refers_to
      reason: "Uncertainty about public schedules or deadlines may require separate source verification."
      triggers: ["user requests verified public examination dates", "user requests public deadline lookup"]
      send: [request_topic, academic_year, campus, date_range]
      do_not_send: [health_details, student_id, private_calendar_data, medical_records, sensitive_personal_information, unrelated_personal_data, raw_conversation]
      expected_output: [schedule_guidance, deadline_checklist, verification_recommendation]
    - target: department-contact-agent
      relationship: refers_to
      reason: "When the user asks for an institutional support channel, verified contact guidance is needed."
      triggers: ["user requests a university support contact", "a responsible unit needs identification", "contact information must be verified"]
      send: [request_topic, preferred_contact_channel]
      do_not_send: [health_details, student_id, sensitive_personal_information, medical_records, unrelated_personal_data, raw_conversation]
      expected_output: [responsible_unit_guidance, contact_guidance, follow_up_steps]
    - target: clubs-activities-agent
      relationship: refers_to
      reason: "A user may voluntarily seek low-pressure social activities after discussing wellbeing needs."
      triggers: ["user explicitly requests club or activity discovery", "user chooses social practice opportunities without adding unwanted workload"]
      send: [club_interests, availability, activity_goals]
      do_not_send: [health_details, student_id, medical_records, sensitive_personal_information, unrelated_personal_data, raw_conversation]
      expected_output: [activity_recommendations, participation_guidance, verification_recommendation]

  soft-skills-coach-agent:
    - target: student-wellbeing-agent
      relationship: refers_to
      reason: "A user may prefer wellbeing and recovery support before continuing skill practice."
      triggers: ["user requests non-clinical overload support", "user chooses to pause skill practice for wellbeing support"]
      send: [wellbeing_goal, situation_summary, preferred_support_style]
      do_not_send: [health_details, student_id, medical_records, sensitive_personal_information, unrelated_personal_data, raw_conversation]
      expected_output: [supportive_guidance, suggested_next_steps, safety_notice]
    - target: clubs-activities-agent
      relationship: supports
      reason: "A user may want activity opportunities to practice a targeted skill."
      triggers: ["user wants practice opportunities", "club interests are relevant", "peer activity is requested"]
      send: [skill_goal, club_interests, career_interests, availability]
      do_not_send: [student_id, unrelated_personal_data, sensitive_personal_information]
      expected_output: [activity_recommendations, participation_guidance, verification_recommendation]
    - target: library-research-agent
      relationship: refers_to
      reason: "A research presentation exercise may require a separate academic source-search strategy."
      triggers: ["user asks to find papers for a presentation", "research topic needs source discovery"]
      send: [research_topic, keywords, preferred_databases]
      do_not_send: [student_id, private_library_credentials, unrelated_personal_data]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]
    - target: scholarship-matching-agent
      relationship: refers_to
      reason: "Scholarship eligibility and current opportunities require verified specialist knowledge; the coach only practices interviews and self-presentation."
      triggers: ["user asks which scholarships are open", "scholarship eligibility must be checked"]
      send: [major, academic_year, eligibility_context]
      do_not_send: [student_id, financial_records, unrelated_personal_data]
      expected_output: [match_summary, missing_requirements, next_actions]
    - target: gpa-academic-standing-agent
      relationship: refers_to
      reason: "GPA calculation from user-provided data is distinct from practicing how to explain an academic result."
      triggers: ["user asks for a GPA calculation", "user asks to simulate grades before practicing an explanation"]
      send: [current_gpa, earned_credits, course_grades]
      do_not_send: [student_id, full_transcript, unrelated_personal_data]
      expected_output: [calculated_gpa, projected_gpa, academic_status]
    - target: academic-advisor-agent
      relationship: refers_to
      reason: "Course and semester planning needs academic advising before the coach helps a student communicate a decision."
      triggers: ["user asks which courses to choose", "student wants a semester plan before discussing it with others"]
      send: [major, academic_year, learning_goals]
      do_not_send: [student_id, full_transcript, unrelated_personal_data]
      expected_output: [progress_summary, tentative_study_plan, risk_notes]
    - target: schedule-deadline-agent
      relationship: refers_to
      reason: "Public dates and deadlines must be verified separately from coaching an announcement or time plan."
      triggers: ["user asks for an official deadline", "a class announcement depends on a public date"]
      send: [request_topic, academic_year, date_range]
      do_not_send: [student_id, private_calendar_data, unrelated_personal_data]
      expected_output: [schedule_guidance, deadline_checklist, verification_recommendation]
    - target: regulation-qa-agent
      relationship: refers_to
      reason: "Applicable rules require verified interpretation; the coach only supports communication or decision practice."
      triggers: ["student representation question depends on a rule", "club activity question asks for an applicable regulation"]
      send: [question, regulation_topic, situation_summary]
      do_not_send: [student_id, sensitive_personal_information, unrelated_personal_data]
      expected_output: [regulation_guidance, source_requirements, verification_recommendation]

  campus-router-agent:
    - target: schedule-deadline-agent
      relationship: refers_to
      reason: "Routes requests about public schedules and deadlines."
      triggers: ["intent is schedule_or_deadline"]
      send: [user_request, academic_year, campus, date_range]
      do_not_send: [unrelated_profile_fields, sensitive_personal_information]
      expected_output: [schedule_guidance, deadline_checklist]
    - target: gpa-academic-standing-agent
      relationship: refers_to
      reason: "Routes GPA calculation and simulation requests."
      triggers: ["intent is gpa_or_academic_standing"]
      send: [user_request, current_gpa, earned_credits, course_grades, planned_courses, expected_grades]
      do_not_send: [student_id, full_transcript, unrelated_profile_fields]
      expected_output: [calculated_gpa, projected_gpa, academic_status]
    - target: academic-advisor-agent
      relationship: refers_to
      reason: "Routes study-progress and learning-plan requests."
      triggers: ["intent is academic_planning"]
      send: [user_request, major, academic_year, completed_courses, planned_courses, learning_goals]
      do_not_send: [student_id, unrelated_profile_fields, sensitive_personal_information]
      expected_output: [progress_summary, tentative_study_plan, risk_notes]
    - target: scholarship-matching-agent
      relationship: refers_to
      reason: "Routes verified scholarship matching requests."
      triggers: ["intent is scholarship"]
      send: [user_request, major, academic_year, current_gpa, earned_credits, training_score]
      do_not_send: [student_id, financial_records, unrelated_profile_fields]
      expected_output: [match_summary, missing_requirements, next_actions]
    - target: library-research-agent
      relationship: refers_to
      reason: "Routes resource discovery and library-search requests."
      triggers: ["intent is library_or_resource_search"]
      send: [user_request, research_topic, course_names, keywords, citation_style]
      do_not_send: [student_id, unrelated_profile_fields, private_library_credentials]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]
    - target: clubs-activities-agent
      relationship: refers_to
      reason: "Routes club and activity discovery requests."
      triggers: ["intent is clubs_or_activities"]
      send: [user_request, club_interests, career_interests, availability, activity_goals]
      do_not_send: [student_id, unrelated_profile_fields, sensitive_personal_information]
      expected_output: [activity_recommendations, participation_guidance]
    - target: administrative-procedure-agent
      relationship: refers_to
      reason: "Routes requests for administrative procedure guidance."
      triggers: ["intent is administrative_procedure"]
      send: [user_request, procedure_type, purpose, deadline_context, available_documents]
      do_not_send: [student_id, submitted_documents, unrelated_profile_fields]
      expected_output: [procedure_guidance, document_checklist, next_actions]
    - target: regulation-qa-agent
      relationship: refers_to
      reason: "Routes regulation and policy questions."
      triggers: ["intent is regulation_question"]
      send: [user_request, question, regulation_topic, situation_summary]
      do_not_send: [student_id, sensitive_personal_information, unrelated_profile_fields]
      expected_output: [regulation_guidance, verification_recommendation]
    - target: department-contact-agent
      relationship: refers_to
      reason: "Routes requests to identify an appropriate university unit."
      triggers: ["intent is department_contact"]
      send: [user_request, request_topic, procedure_type, campus, preferred_contact_channel]
      do_not_send: [student_id, unrelated_profile_fields, sensitive_personal_information]
      expected_output: [responsible_unit_guidance, contact_guidance]
    - target: general-education-tutor-agent
      relationship: refers_to
      reason: "Routes general education concept explanation, math/physics guidance, and sample exercise requests."
      triggers: ["intent is general_education_learning"]
      send: [user_request, course_name, topic_name, problem_statement, learning_goals]
      do_not_send: [student_id, unrelated_profile_fields, exam_papers]
      expected_output: [concept_explanation, solution_guidance, practice_suggestions]
    - target: political-theory-tutor-agent
      relationship: refers_to
      reason: "Routes political theory explanation, philosophy mindmaps, and exam review requests."
      triggers: ["intent is political_theory_learning"]
      send: [user_request, course_name, topic_name, exam_review_topic, study_questions]
      do_not_send: [student_id, unrelated_profile_fields, sensitive_political_opinions]
      expected_output: [theory_explanation, concept_mindmap_outline, study_guidance]
    - target: core-foundations-tutor-agent
      relationship: refers_to
      reason: "Routes core computer science, programming, DSA, database, and system architecture questions."
      triggers: ["intent is core_foundations_learning"]
      send: [user_request, course_name, programming_language, algorithm_topic, database_schema]
      do_not_send: [student_id, graded_homework_code, wecode_tests]
      expected_output: [conceptual_guidance, algorithmic_hints, debugging_strategy]
    - target: specialized-major-tutor-agent
      relationship: refers_to
      reason: "Routes specialized major subjects (AI/Data Science, Software Engineering, Security, Networks, IS)."
      triggers: ["intent is specialized_major_learning"]
      send: [user_request, specialization, course_name, advanced_topic, technology_stack]
      do_not_send: [student_id, commercial_code, private_capstone_materials]
      expected_output: [specialized_guidance, architectural_analysis, learning_roadmap]
    - target: student-wellbeing-agent
      relationship: refers_to
      reason: "Routes non-clinical wellbeing and self-care requests."
      triggers: ["intent is wellbeing"]
      send: [user_request, wellbeing_goal, situation_summary, preferred_support_style]
      do_not_send: [health_records, student_id, unrelated_profile_fields]
      expected_output: [supportive_guidance, suggested_next_steps, safety_notice]
    - target: soft-skills-coach-agent
      relationship: refers_to
      reason: "Routes skill-development and practice requests."
      triggers: ["intent is soft_skills"]
      send: [user_request, skill_goal, career_interests, current_challenges, practice_context]
      do_not_send: [student_id, unrelated_profile_fields, sensitive_personal_information]
      expected_output: [practice_plan, feedback_framework, next_steps]
    - target: campus-aggregator-agent
      relationship: provides_data_to
      reason: "Provides the routing plan and collected structured responses for final synthesis."
      triggers: ["one or more specialist responses are ready", "a multi-intent request needs a unified response"]
      send: [user_request, routing_plan, specialist_responses]
      do_not_send: [full_user_profile, raw_sensitive_data, unrelated_personal_data]
      expected_output: [unified_response, action_plan, assumptions, limitations]

  campus-aggregator-agent:
    - target: campus-router-agent
      relationship: collaborates_with
      reason: "Uses the Router's routing plan to preserve intent coverage in the final response."
      triggers: ["routing plan is available"]
      send: [user_request, specialist_responses]
      do_not_send: [full_user_profile, raw_sensitive_data]
      expected_output: [routing_plan, missing_information]
    - target: schedule-deadline-agent
      relationship: collaborates_with
      reason: "Incorporates structured schedule and deadline guidance."
      triggers: ["schedule specialist response is available"]
      send: [user_request, schedule_guidance]
      do_not_send: [full_user_profile, raw_sensitive_data]
      expected_output: [schedule_guidance, deadline_checklist]
    - target: gpa-academic-standing-agent
      relationship: collaborates_with
      reason: "Incorporates calculated or projected GPA results."
      triggers: ["GPA specialist response is available"]
      send: [user_request, calculated_gpa, projected_gpa, academic_status]
      do_not_send: [full_transcript, student_id, raw_sensitive_data]
      expected_output: [calculated_gpa, projected_gpa, academic_status]
    - target: academic-advisor-agent
      relationship: collaborates_with
      reason: "Incorporates tentative learning-plan guidance."
      triggers: ["academic-advisor response is available"]
      send: [user_request, progress_summary, tentative_study_plan, risk_notes]
      do_not_send: [full_user_profile, raw_sensitive_data]
      expected_output: [progress_summary, tentative_study_plan, risk_notes]
    - target: scholarship-matching-agent
      relationship: collaborates_with
      reason: "Incorporates verified scholarship matching results."
      triggers: ["scholarship specialist response is available"]
      send: [user_request, match_summary, missing_requirements, next_actions]
      do_not_send: [financial_records, student_id, raw_sensitive_data]
      expected_output: [match_summary, missing_requirements, next_actions]
    - target: library-research-agent
      relationship: collaborates_with
      reason: "Incorporates resource-search guidance."
      triggers: ["library specialist response is available"]
      send: [user_request, search_strategy, suggested_keywords, resource_guidance]
      do_not_send: [full_user_profile, raw_sensitive_data]
      expected_output: [search_strategy, suggested_keywords, resource_guidance]
